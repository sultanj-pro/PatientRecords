<div class="login-container">
  <div class="login-card">
    <h1>Patient Records System</h1>
    <h2>Login</h2>

    <div *ngIf="sessionExpired" class="session-expired-banner">
      ⚠️ Your session has expired. Please log in again.
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          class="form-control"
          placeholder="Enter your username"
          [disabled]="loading"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="form-control"
          placeholder="Enter your password"
          [disabled]="loading"
          autocomplete="current-password"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading || !username.trim() || !password"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <div class="demo-users">
      <p class="text-muted">Demo Credentials:</p>
      <ul>
        <li><strong>admin</strong> / Admin1234!</li>
        <li><strong>doctor</strong> / Doctor1234!</li>
        <li><strong>nurse</strong> / Nurse1234!</li>
      </ul>
    </div>
  </div>
</div>
